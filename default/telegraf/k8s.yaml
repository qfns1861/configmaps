argo:
  app: telegraf # 必填：应用名
  cluster: hf01 # 必填：集群名
  chart: telegraf # 必填：chart 名
  chartVersion: 1.8.57 # 必填：chart 版本
  chartRepo: http://192.168.16.128:30380 # 必填：chart 仓库
  server: https://kubernetes.default.svc # 必填：目标集群
  namespace: hf01 # 选填：命名空间（默认 = app）
  valuesBranch: main # 选填：Git 分支（默认 HEAD）

k8s:
  replicaCount: 1
  image:
    repo: telegraf
    tag: 1.32.1-alpine-cicd
    meta:
      pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"

  podAnnotations: {}

  podLabels: {}

  imagePullSecrets: []

  prometheus_client:
    listen: 9273

  args: []

  env:
    - name: HOSTNAME
      value: "10.10.10.12"

  nodeSelector: {}

  affinity: {}

  tolerations: []

  updateStrategy: {}

  service:
    enabled: true
    type: ClusterIP
    annotations: {}

  rbac:
    create: false
    clusterWide: false
    rules: []

  serviceAccount:
    create: false
    name:
    annotations: {}

  pdb:
    create: true
    minAvailable: 1

  cilium:
    enabled: false
